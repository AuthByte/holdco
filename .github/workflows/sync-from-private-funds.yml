name: Sync Holdco app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-from-private-funds.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout holdco
        uses: actions/checkout@v4

      - name: Copy app from private-funds
        run: |
          git clone --depth 1 --branch cursor/private-markets-funds-dashboard-c82b \
            https://github.com/AuthByte/private-funds.git /tmp/holdco-src
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            /tmp/holdco-src/ ./

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sync Holdco app from private-funds"
          git push
